id: react-python-json
title: React + Python + JSON Prototype Kit
version: 0.1
architecture_profile: simple-crud-app
stack:
  frontend: React / JavaScript
  backend: Python / FastAPI-compatible structure
  storage: local JSON files
supports:
- list_view
- form_editor
- text_search
- local_crud
- local_json_storage
- mock_data
limits:
  max_entities: 5
  max_screens: 8
  external_integrations: 0
rules:
  implement_only_slice_scope: true
  prefer_one_owned_file_per_scheme_element: true
  allow_integration_files: true
  require_traceability_report: true
validation:
  task_runner: taskfile
  default_task: validate
architecture_contract: architecture-contract.yaml
