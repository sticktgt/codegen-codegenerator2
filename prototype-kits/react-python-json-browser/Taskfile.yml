version: '3'

tasks:
  install:
    desc: Install backend, frontend, and browser test dependencies
    cmds:
      - python3 -m venv .venv
      - .venv/bin/python -m pip install --upgrade pip
      - .venv/bin/python -m pip install -r backend/requirements.txt
      - cd frontend && npm install --no-package-lock
      - cd frontend && npx playwright install chromium

  smoke:
    desc: Run backend smoke check
    cmds:
      - cd backend && PYTHONPATH=. ../.venv/bin/python -m app.smoke

  test:
    desc: Run backend tests
    cmds:
      - cd backend && PYTHONPATH=. ../.venv/bin/python -m pytest

  build:
    desc: Build frontend
    cmds:
      - cd frontend && npm run build

  frontend-behavior-setup:
    desc: Install Playwright browser and host OS dependencies for local browser/e2e validation
    cmds:
      - cd frontend && npx playwright install --with-deps chromium

  frontend-behavior:
    desc: Run browser/e2e UI behavior tests
    cmds:
      - cd frontend && npm run test:e2e

  validate:
    desc: Install dependencies and validate prototype including browser UI behavior tests
    cmds:
      - task: install
      - task: smoke
      - task: test
      - task: build
      - task: frontend-behavior

  export:
    desc: Export prototype artifact
    cmds:
      - mkdir -p dist
      - zip -r dist/prototype_artifact.zip frontend backend prototype -x "frontend/node_modules/*" ".venv/*" "frontend/dist/*" "frontend/playwright-report/*" "frontend/test-results/*"
